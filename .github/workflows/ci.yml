name: LTD's Book Store CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "test/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r server/requirements-test.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check server/web/app.js
      - name: Catalog tests
        run: node --test tests/*.test.cjs

      - name: Build standalone ZIP
        run: python scripts/package.py
      - name: Verify standalone ZIP
        run: python scripts/verify_package.py
      - name: Upload verified ZIP (Ubuntu build only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LTDs-Book-Store-local
          path: dist/LTDs-Book-Store-*.zip
          if-no-files-found: error
          retention-days: 14
