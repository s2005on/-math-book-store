name: LTD's Book Store CI

# Pull requests validate feature branches; push runs validate main only.
# This avoids duplicate checks (and notifications) for the same branch commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r server/requirements-test.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check server/web/app.js
      - name: JavaScript tests
        run: node --test tests/*.test.cjs
