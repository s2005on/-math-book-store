name: Publish verified book-store release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert tag matches VERSION
        shell: bash
        run: |
          expected="v$(cat VERSION | tr -d '\r\n')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $expected"
            exit 1
          fi
      - name: Install test dependencies
        run: python -m pip install -r server/requirements-test.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript checks
        run: |
          node --check server/web/app.js
          node --test tests/*.test.cjs
      - name: Build and verify ZIP
        run: |
          python scripts/package.py
          python scripts/verify_package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Math-Book-Store-*.zip \
            --title "Math Book Store $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
