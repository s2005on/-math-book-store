<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập | LTD's Book Store</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eff7f9,#fff5ea);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;color:#18384d}.panel{width:min(440px,calc(100% - 32px));background:#fff;padding:32px;border-radius:23px;box-shadow:0 15px 55px #17394f1b}.brand{color:#12637d;text-decoration:none;font-weight:800}.brand span{font-size:29px}h1{font-size:26px;margin:24px 0 7px}p{color:#647989;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:16px 0}input{display:block;width:100%;padding:13px;border:1px solid #c8d5dd;border-radius:11px;margin-top:7px;font:inherit}button{cursor:pointer;font:inherit;border:0}.submit{background:#086581;color:#fff;width:100%;border-radius:11px;padding:13px;font-weight:750;margin-top:12px}.links{display:flex;justify-content:space-between;gap:14px;margin-top:19px;font-size:13px}.links button{padding:0;background:none;color:#086581;font-weight:700}.links a{color:#086581;text-decoration:none}#message{min-height:21px;color:#ba3f32}small{color:#74899a}</style></head><body><main class="panel"><a href="/" class="brand"><span>∑</span> LTD's Book Store</a><h1 id="heading">Đăng nhập</h1><p id="hint">Đăng nhập tài khoản để sử dụng cửa hàng. Quản trị viên cũng đăng nhập tại đây.</p><form id="form"><label>Tên đăng nhập<input name="username" autocomplete="username" minlength="3" maxlength="60" required></label><label>Mật khẩu<input name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button class="submit" id="submit">Đăng nhập</button></form><p id="message" role="status"></p><div class="links"><button id="toggle" type="button">Tạo tài khoản mới</button><a href="/">Về cửa hàng →</a></div><p><small>Chỉ đăng ký tài khoản khách hàng. Quyền quản trị được cấp riêng trên máy chủ.</small></p></main><script>
const f=document.querySelector('#form'),msg=document.querySelector('#message'),heading=document.querySelector('#heading'),toggle=document.querySelector('#toggle'),submit=document.querySelector('#submit');let signup=false;
toggle.onclick=()=>{signup=!signup;heading.textContent=signup?'Tạo tài khoản':'Đăng nhập';submit.textContent=signup?'Đăng ký':'Đăng nhập';toggle.textContent=signup?'Đã có tài khoản? Đăng nhập':'Tạo tài khoản mới';msg.textContent='';f.elements.password.minLength=signup?10:8;f.elements.password.autocomplete=signup?'new-password':'current-password';};
f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.textContent='';try{const form=new FormData(f);const r=await fetch(signup?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:form.get('username'),password:form.get('password')})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Không thực hiện được');if(signup){msg.style.color='#16734b';msg.textContent='Đăng ký thành công! Hãy đăng nhập.';toggle.click();}else{location.href=data.role==='admin'?'/admin.html':'/account.html';}}catch(err){msg.style.color='#b13b2b';msg.textContent=err.message||'Lỗi kết nối máy chủ';}finally{submit.disabled=false;}};
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.authenticated)location.href=d.role==='admin'?'/admin.html':'/account.html';}).catch(()=>{msg.textContent='Đăng nhập cần chạy qua máy chủ FastAPI, không hoạt động trên GitHub Pages.';});
</script></body></html>
