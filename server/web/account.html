<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản · Math Book Store</title><style>body{font-family:system-ui,sans-serif;background:#f2f6f7;margin:0;color:#193a4a}.wrap{max-width:570px;margin:8vh auto;padding:24px;background:white;border-radius:20px;box-shadow:0 8px 28px #15426312}a{color:#0c637c;text-decoration:none}button{border:0;border-radius:10px;background:#0d6681;color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}p{color:#627885}</style></head><body><main class="wrap"><a href="/">← Về cửa hàng</a><h1>Tài khoản của bạn</h1><p id="status">Đang kiểm tra trạng thái đăng nhập...</p><p id="admin"></p><button id="logout" hidden>Đăng xuất</button></main><script>
let token='';fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(!d.authenticated){location.replace('/login.html');return;}token=d.csrf;document.querySelector('#status').textContent='Đang đăng nhập: '+d.username+' ('+(d.role==='admin'?'quản trị viên':'khách hàng')+')';document.querySelector('#logout').hidden=false;if(d.role==='admin')document.querySelector('#admin').innerHTML='<a href="/admin.html">Vào trang quản trị sách →</a>';}).catch(()=>document.querySelector('#status').textContent='Tính năng tài khoản cần máy chủ FastAPI.');
document.querySelector('#logout').onclick=async()=>{const r=await fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token}});if(r.ok)location.href='/login.html';else alert('Không đăng xuất được');};
</script></body></html>
